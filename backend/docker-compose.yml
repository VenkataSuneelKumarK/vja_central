version: "3.9"

# Local development stack: the API, MongoDB, and MinIO (an S3-compatible
# object store) — so the whole backend runs with zero AWS account needed
# until you're actually ready to deploy.
services:
  api:
    build: .
    ports:
      - "4000:4000"
    env_file: .env
    environment:
      - DATABASE_URL=mongodb://mongo:27017/vja_central
      - AWS_S3_ENDPOINT=http://minio:9000
      - AWS_S3_FORCE_PATH_STYLE=true
    depends_on:
      - mongo
      - minio

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data

volumes:
  mongo_data:
  minio_data:
